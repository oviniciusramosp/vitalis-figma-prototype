name: VitalisPrototype
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  VitalisPrototype:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vitalis Prototype
        UILaunchScreen: {}
        NSMotionUsageDescription: Tilting your iPhone gently moves the prototype background.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Inter.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vitalisprototype
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
  VitalisPrototypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VitalisPrototype
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.vitalisprototype.uitests
schemes:
  VitalisPrototype:
    build:
      targets:
        VitalisPrototype: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: VitalisPrototypeUITests
          parallelizable: false
